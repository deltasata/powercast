[project]
name = "powercast"
version = "0.1.0"
description = "Probabilistic day-ahead electricity price forecasts for the German-Luxembourg bidding zone"
readme = "README.md"
license = "MIT"
authors = [{ name = "Satadru Bag" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "requests>=2.31",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "lightgbm>=4.3",
    "matplotlib>=3.8",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
deep = ["torch>=2.4", "chronos-forecasting>=2.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/powercast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DTZ"]
