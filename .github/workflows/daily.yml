name: daily forecast

# 08:40 UTC = 10:40 Berlin in summer (CEST); 09:40 UTC = 10:40 Berlin in winter (CET).
# The script exits at once if tomorrow's forecast already exists or it is before 10:15.
on:
  schedule:
    - cron: "40 8 * * *"
    - cron: "40 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -r requirements-live.txt
          pip install -r requirements-deep.txt
          pip install --no-deps -e .

      - name: Restore model weights
        uses: actions/cache@v4
        with:
          path: .cache/hf
          key: hf-chronos-2-29ec3766

      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: data/live
          key: live-${{ github.run_id }}
          restore-keys: live-

      - name: Forecast
        env:
          HF_HOME: ${{ github.workspace }}/.cache/hf
        run: python scripts/daily_forecast.py --state data/live --out forecasts/live

      - name: Save data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/live
          key: live-${{ github.run_id }}

      - name: Publish
        run: |
          git config user.name "Satadru Bag"
          git config user.email "satadru.iucaa@gmail.com"
          git add forecasts/live
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Daily forecast $(date -u +%Y-%m-%d)"
          git push
