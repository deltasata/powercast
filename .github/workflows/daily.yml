name: daily forecast

# GitHub starts few of the scheduled triggers of this repository, at unpredictable times
# (D12.1, D12.3 in docs/DECISIONS.md). Each run therefore decides with scripts/gate.py:
# forecast now, wait until 10:15 Berlin (at most 230 min) and forecast, or hand over to a
# fresh run of this workflow after a sleep (at most 6 hand-overs; a run that forecasts
# never hands over). Any trigger that fires during the day thus leads to an on-time
# forecast the next morning. Runs are serialised by the concurrency group.
on:
  schedule:
    - cron: "17 0 * * *"
    - cron: "47 2 * * *"
    - cron: "23 4 * * *"
    - cron: "53 5 * * *"
    - cron: "37 7 * * *"
    - cron: "13 8 * * *"
    - cron: "13 9 * * *"
    - cron: "43 10 * * *"
    - cron: "7 13 * * *"
    - cron: "37 15 * * *"
    - cron: "23 18 * * *"
    - cron: "13 21 * * *"
  workflow_dispatch:
    inputs:
      hop:
        description: "hand-over count (set by the job itself)"
        default: "0"

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Decide (forecast now, wait, or hand over)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/gate.py --repo "${{ github.repository }}" --hop "${{ inputs.hop }}"

      - name: Hand over to a fresh run
        if: steps.gate.outputs.mode == 'relay'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "sleeping ${{ steps.gate.outputs.sleep_s }} s, then hand-over ${{ steps.gate.outputs.next_hop }}"
          sleep "${{ steps.gate.outputs.sleep_s }}"
          for i in 1 2 3; do
            gh workflow run daily.yml --ref main -f hop="${{ steps.gate.outputs.next_hop }}" && exit 0
            sleep 30
          done
          exit 1

      - name: Wait until 10:15 Berlin
        if: steps.gate.outputs.mode == 'forecast'
        run: |
          echo "waiting ${{ steps.gate.outputs.wait_s }} s"
          sleep "${{ steps.gate.outputs.wait_s }}"
          git pull --ff-only origin main   # a forecast pushed meanwhile is seen

      - if: steps.gate.outputs.mode == 'forecast'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        if: steps.gate.outputs.mode == 'forecast'
        run: |
          pip install -r requirements-live.txt
          pip install -r requirements-deep.txt
          pip install --no-deps -e .

      - name: Restore model weights
        if: steps.gate.outputs.mode == 'forecast'
        uses: actions/cache@v6
        with:
          path: .cache/hf
          key: hf-chronos-2-29ec3766

      - name: Restore data cache
        if: steps.gate.outputs.mode == 'forecast'
        uses: actions/cache/restore@v6
        with:
          path: data/live
          key: live-${{ github.run_id }}
          restore-keys: live-

      - name: Forecast
        if: steps.gate.outputs.mode == 'forecast'
        env:
          HF_HOME: ${{ github.workspace }}/.cache/hf
        run: python scripts/daily_forecast.py --state data/live --out forecasts/live

      - name: Save data cache
        if: always() && steps.gate.outputs.mode == 'forecast'
        uses: actions/cache/save@v6
        with:
          path: data/live
          key: live-${{ github.run_id }}

      - name: Publish
        if: steps.gate.outputs.mode == 'forecast'
        run: |
          git config user.name "Satadru Bag"
          git config user.email "satadru.iucaa@gmail.com"
          git add forecasts/live
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          days=$(git diff --cached --name-only --diff-filter=A -- 'forecasts/live/*.csv' \
                 | xargs -r -n1 basename | sed 's/\.csv$//' | paste -sd' ')
          git commit -m "Daily forecast ${days:-(track record update)}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 20
          done
          exit 1
